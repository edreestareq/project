<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تدقيق وإدارة الإعلانات | KARAJAK AI Admin</title>
    <link rel="stylesheet" href="/css/karajak.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
            <div>
                <h1 style="font-size:1.8rem; font-weight:800;">إدارة وتدقيق إعلانات المركبات</h1>
                <p style="color:var(--text-secondary); font-size:0.85rem;">مراجعة وقبول أو رفض إعلانات السيارات المقدمة من التجار والمعارض المعتمدة قبل نشرها.</p>
            </div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="admin-listings-search" class="form-control" style="width:240px;" placeholder="بحث برقم الهيكل أو الموديل...">
            </div>
        </div>

        <!-- Filter Categories (Figure 5.35) -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;">
            <div style="display:flex; gap:10px;">
                <button class="btn btn-primary btn-sm" onclick="loadAdminListings('All')">جميع الإعلانات</button>
                <button class="btn btn-outline btn-sm" onclick="loadAdminListings('Pending')">بانتظار المراجعة (Pending)</button>
                <button class="btn btn-outline btn-sm" onclick="loadAdminListings('Available')">المعتمدة والنشطة (Available)</button>
                <button class="btn btn-outline btn-sm" onclick="loadAdminListings('Rejected')">المرفوضة (Rejected)</button>
            </div>
            <span style="font-size:0.85rem; color:var(--text-muted);">الترتيب: <strong>الأحدث أولاً</strong></span>
        </div>

        <!-- High Priority Banner (Figure 5.35) -->
        <div style="display:flex; justify-content:space-between; align-items:center; background:linear-gradient(90deg, #1e1b4b, #1e293b); border:1px solid rgba(249,115,22,0.3); border-radius:var(--radius-md); padding:18px 24px; margin-bottom:24px;">
            <div>
                <div style="font-size:0.75rem; text-transform:uppercase; color:var(--accent-orange); font-weight:700;">قوائم تتطلب اتخاذ إجراء</div>
                <div style="font-size:1.6rem; font-weight:900;" id="high-priority-counter">إعلانات بانتظار التدقيق الإداري</div>
                <div style="font-size:0.8rem; color:var(--text-muted);">تم تقديمها من قبل معارض وتجار مسجلين</div>
            </div>
            <div style="text-align:left;">
                <div style="font-size:0.75rem; color:var(--text-muted);">معدل زمن المراجعة</div>
                <div style="font-size:1.4rem; font-weight:800; color:#34d399;">14.2 دقيقة</div>
            </div>
        </div>

        <!-- Listings Dynamic Grid (Figure 5.35) -->
        <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:20px;">
            <!-- Dynamically populated by admin.js -->
        </div>
    </main>

    <script src="/js/navbar.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderHeader("admin-listings");
            loadAdminListings("All");
        });
    </script>
</body>
</html>
