<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشكاوى والبلاغات | KARAJAK AI Admin</title>
    <link rel="stylesheet" href="/css/karajak.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="main-content" style="max-width:1050px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:10px;">
            <div>
                <h1 style="font-size:1.8rem; font-weight:800;">الشكاوى وبلاغات الجودة</h1>
                <p style="color:var(--text-secondary); font-size:0.85rem;">مراجعة أنشطة البلاغات لضمان أمان وشفافية الصفقات في منصة KARAJAK.</p>
            </div>
            <a href="/api/admin/transactions/export-csv" class="btn btn-primary btn-sm">📥 تصدير السجل CSV</a>
        </div>

        <!-- 3 KPI Cards (Figure 5.36) -->
        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px; margin-bottom:28px;">
            <div class="stat-card">
                <div class="stat-label">البلاغات النشطة</div>
                <div class="stat-value" style="color:var(--accent-red);">--</div>
                <div class="stat-delta negative">تتطلب المراجعة</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">متوسط زمن الاستجابة</div>
                <div class="stat-value">4.2h</div>
                <div class="stat-delta positive">ضمن معايير الجودة</div>
            </div>
            <div class="stat-card" style="background:linear-gradient(135deg, #1e1b4b, #1e293b); border-color:rgba(59,130,246,0.3);">
                <div class="stat-label" style="color:#93c5fd;">مؤشر الثقة والمصداقية</div>
                <div class="stat-value" style="color:#34d399;">98.4%</div>
                <div class="stat-delta" style="color:#60a5fa;">Trust Index Score</div>
            </div>
        </div>

        <!-- Report Cards (Figure 5.36) -->
        <div>
            <!-- Dynamically populated by admin.js -->
        </div>
    </main>

    <script src="/js/navbar.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderHeader("admin-reports");
            loadAdminReports();
        });
    </script>
</body>
</html>
