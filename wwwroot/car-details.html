<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المركبة | KARAJAK</title>
    <link rel="stylesheet" href="/css/karajak.css?v=202611206">
</head>
<body>
    <main class="main-content" style="padding-top:20px;">
        <!-- Back Navigation & Breadcrumb -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--border-color); flex-wrap:wrap; gap:10px;">
            <a href="/marketplace.html" class="btn btn-outline btn-sm" style="font-weight:700;">← العودة إلى سوق السيارات</a>
            <div style="font-size:0.85rem; color:var(--text-muted);">
                <a href="/marketplace.html" style="color:var(--text-muted); text-decoration:none;">السوق</a> &gt; 
                <span id="breadcrumb-title" style="color:var(--accent-orange); font-weight:600;">تفاصيل المركبة</span>
            </div>
        </div>

        <!-- Loading / Error State -->
        <div id="car-state" style="text-align:center; padding:60px 20px; background:var(--bg-surface-card); border:1px solid var(--border-color); border-radius:var(--radius-md); color:var(--text-muted);">
            جاري تحميل بيانات المركبة...
        </div>

        <!-- Main Vehicle Details (hidden until loaded) -->
        <div id="car-content" style="display:none;">
            <div class="vehicle-details-layout">
                <!-- Right Column (in RTL): Media, Specs & Seller -->
                <div>
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
                        <div>
                            <h1 id="car-title" style="font-size:2rem; font-weight:900; margin:0;">--</h1>
                            <div id="car-subtitle" style="color:var(--text-muted); font-size:0.9rem; margin-top:4px;">--</div>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button class="btn btn-outline btn-sm" onclick="navigator.clipboard?.writeText(window.location.href); showToast('تم نسخ رابط المركبة بنجاح!')">🔗 مشاركة</button>
                        </div>
                    </div>

                    <img id="main-gallery-img" src="" class="gallery-main" alt="صورة المركبة">
                    <div id="thumbs-container" class="gallery-thumbs" style="margin-bottom:20px;"></div>

                    <!-- Description -->
                    <div id="description-box" style="display:none; margin-top:24px; background:var(--bg-surface-card); padding:20px; border-radius:var(--radius-md); border:1px solid var(--border-color);">
                        <h3 style="font-size:1.1rem; font-weight:800; margin-bottom:10px;">وصف المركبة</h3>
                        <p id="car-description" style="color:var(--text-secondary); font-size:0.92rem; line-height:1.7; margin:0;"></p>
                    </div>

                    <!-- Specifications Grid -->
                    <div style="margin-top:24px;">
                        <h3 style="font-size:1.15rem; font-weight:800; margin-bottom:12px;">المواصفات الفنية</h3>
                        <div id="specs-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; font-size:0.88rem; background:var(--bg-surface-card); padding:20px; border-radius:var(--radius-md); border:1px solid var(--border-color);">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <!-- Key Features Chips -->
                    <div id="features-box" style="display:none; margin-top:24px;">
                        <h4 style="font-size:0.95rem; font-weight:700; color:var(--text-muted); margin-bottom:10px;">المميزات الرئيسية</h4>
                        <div id="features-container" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
                    </div>

                    <!-- Seller Dealership Card -->
                    <div style="margin-top:24px; background:var(--bg-surface-card); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:20px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                            <div style="display:flex; align-items:center; gap:14px;">
                                <img id="seller-avatar" src="" style="width:50px; height:50px; border-radius:50%; object-fit:cover; background:#374151;">
                                <div>
                                    <h4 style="font-weight:700; margin:0 0 4px;" id="seller-name">--</h4>
                                    <div id="seller-verified" style="font-size:0.8rem; color:var(--accent-emerald); font-weight:700;">--</div>
                                </div>
                            </div>
                            <div id="seller-actions" style="display:flex; gap:10px;"></div>
                        </div>
                    </div>
                </div>

                <!-- Left Column (in RTL): Pricing & Booking Action Card -->
                <div>
                    <div style="background:var(--bg-surface-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:28px; position:sticky; top:24px;">
                        <div id="car-status-line" style="font-size:0.85rem; font-weight:700; margin-bottom:8px;">--</div>
                        <div id="checkout-price" style="font-size:2.4rem; font-weight:900; color:var(--accent-orange); margin-bottom:20px;">--</div>

                        <div id="booking-actions" style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px;"></div>

                        <div style="background:rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:var(--radius-sm); padding:14px; font-size:0.8rem; color:var(--text-muted); line-height:1.5;">
                            🛡️ <strong>حماية وضمان KARAJAK:</strong> جميع عمليات الحجز والدفع تتم عبر بوابة آمنة وموثقة بين المشتري والمعرض.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/auth.js?v=202611206"></script>
    <script src="/js/marketplace.js?v=202611206"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderHeader("marketplace");
            const id = parseInt(new URLSearchParams(window.location.search).get("id"), 10);
            if (!id) {
                document.getElementById("car-state").innerHTML = 'لم يتم تحديد مركبة.<br><br><a href="/marketplace.html" class="btn btn-primary btn-sm">العودة إلى السوق</a>';
                return;
            }
            loadCarDetails(id);
        });
    </script>
</body>
</html>
