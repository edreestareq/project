<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Dashboard | KARAJAK AI</title>
    <link rel="stylesheet" href="/css/karajak.css">
    <style>
        .dashboard-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 28px;
            margin-top: 10px;
        }
        .sidebar {
            background: var(--bg-surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px 16px;
            height: fit-content;
        }
        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 16px;
        }
        .sidebar-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .sidebar-item.active a, .sidebar-item a:hover {
            background: rgba(249, 115, 22, 0.12);
            color: var(--accent-orange);
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="main-content">
        <div class="dashboard-layout">
            <!-- Sidebar (Figure 5.43) -->
            <aside class="sidebar">
                <div style="display:flex; align-items:center; gap:12px; padding-bottom:16px; border-bottom:1px solid var(--border-color);">
                    <img id="sidebar-user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" style="width:44px; height:44px; border-radius:50%; object-fit:cover;">
                    <div>
                        <div id="sidebar-user-name" style="font-weight:700; font-size:0.95rem;">المستخدم</div>
                        <div id="sidebar-user-badge" style="font-size:0.75rem; color:var(--accent-orange); font-weight:600;">مشتري معتمد</div>
                    </div>
                </div>

                <ul class="sidebar-menu">
                    <li class="sidebar-item"><a href="/marketplace.html">🔍 تصفح سوق السيارات</a></li>
                    <li class="sidebar-item active"><a href="/buyer-dashboard.html">📅 حجوزاتي وفواتيري</a></li>
                    <li class="sidebar-item"><a href="/messages.html">💬 المحادثات والعروض</a></li>
                    <li class="sidebar-item"><a href="/index.html">🏠 الرئيسية</a></li>
                </ul>
            </aside>

            <!-- Main Content Area (Figure 5.43 & Figure 5.50) -->
            <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <div>
                        <h2 style="font-size:1.8rem; font-weight:800;">My Bookings</h2>
                        <p style="color:var(--text-secondary); font-size:0.88rem;">Manage your reserved and purchased premium vehicles.</p>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-primary btn-sm" onclick="filterBookings('all')">All Bookings</button>
                        <button class="btn btn-outline btn-sm" onclick="filterBookings('Reserved')">Reserved</button>
                        <button class="btn btn-outline btn-sm" onclick="filterBookings('Purchased')">Purchased</button>
                    </div>
                </div>

                <!-- Bookings Grid (Figure 5.43) -->
                <div id="buyer-bookings-container">
                    <!-- Dynamically populated or pre-rendered cards -->
                </div>
            </div>
        </div>
    </main>

    <script src="/js/navbar.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", () => {
            const userJson = localStorage.getItem("karajak_user");
            if (!userJson) {
                window.location.href = "/buyer-login.html";
                return;
            }
            currentUser = JSON.parse(userJson);
            if (currentUser.role !== "Buyer" && currentUser.role !== "Admin") {
                window.location.href = currentUser.role === "Seller" ? "/seller-dashboard.html" : "/auth-portal.html";
                return;
            }

            document.getElementById("sidebar-user-name").innerText = currentUser.fullName;
            if (currentUser.profilePicture) {
                document.getElementById("sidebar-user-avatar").src = currentUser.profilePicture;
            }

            renderHeader("buyer-dashboard");
            loadBookings();
        });

        async function loadBookings(filter = 'all') {
            const container = document.getElementById("buyer-bookings-container");
            container.innerHTML = "<div style='padding:30px; text-align:center;'>جاري تحميل حجوزاتك من قاعدة البيانات...</div>";

            try {
                const userId = currentUser ? currentUser.id : 6;
                const res = await fetch(`/api/bookings/my?buyerId=${userId}`);
                let bookings = await res.json();

                if (filter !== 'all') {
                    bookings = bookings.filter(b => (b.bookingStatus === filter || (filter === 'Purchased' && b.bookingStatus === 'Completed')));
                }

                if (!bookings || bookings.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:50px; background:var(--bg-surface-card); border-radius:var(--radius-md); border:1px solid var(--border-color);">
                        <h3>No Bookings Found</h3>
                        <p style="color:var(--text-muted); margin:10px 0 20px;">You haven't reserved or purchased any vehicles yet.</p>
                        <a href="/marketplace.html" class="btn btn-primary">Browse Vehicles Now</a>
                    </div>`;
                    return;
                }

                container.innerHTML = bookings.map(b => {
                    const car = b.car;
                    const img = (car && car.images && car.images.length > 0) ? car.images[0].imageUrl : "https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=400&q=80";
                    const isCompleted = b.bookingStatus === 'Completed' || b.bookingStatus === 'Paid';
                    return `
                        <div style="background:var(--bg-surface-card); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:20px; display:flex; gap:20px; align-items:center; margin-bottom:16px;">
                            <img src="${img}" style="width:160px; height:105px; border-radius:var(--radius-sm); object-fit:cover;">
                            <div style="flex:1;">
                                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                    <div>
                                        <h3 style="font-size:1.2rem; font-weight:800;">${car ? car.year + ' ' + car.brand + ' ' + car.model : 'Vehicle'}</h3>
                                        <div style="font-size:0.8rem; color:var(--text-muted); margin-top:2px;">Booking ID: #KJ-${b.id + 88420} • Date: ${new Date(b.bookingDate).toLocaleDateString()}</div>
                                    </div>
                                    <span class="status-chip ${isCompleted ? 'status-active' : 'status-pending'}">
                                        ${b.bookingStatus.toUpperCase()}
                                    </span>
                                </div>
                                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:14px;">
                                    <div style="font-size:1.3rem; font-weight:900; color:var(--accent-orange);">$${b.offerAmount.toLocaleString()}</div>
                                    <div style="display:flex; gap:10px;">
                                        <a href="/api/bookings/${b.id}/invoice" target="_blank" class="btn btn-outline btn-sm">📄 View Invoice</a>
                                        ${!isCompleted ? `<a href="/checkout.html?carId=${car ? car.id : 1}" class="btn btn-primary btn-sm">Complete Purchase</a>` : `<button class="btn btn-secondary btn-sm" onclick="alert('Thank you for rating your experience!')">★ Leave Review</button>`}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join("");
            } catch (err) {
                console.error("Bookings error:", err);
            }
        }

        function filterBookings(type) {
            loadBookings(type);
        }
    </script>
</body>
</html>
