<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المشتري وحجوزاتي | KARAJAK AI</title>
    <link rel="stylesheet" href="/css/karajak.css">
    <style>
        .dashboard-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 28px;
            margin-top: 10px;
        }
        .sidebar {
            background: var(--bg-surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px 16px;
            height: fit-content;
        }
        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 16px;
        }
        .sidebar-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .sidebar-item.active a, .sidebar-item a:hover {
            background: rgba(249, 115, 22, 0.12);
            color: var(--accent-orange);
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="main-content">
        <div class="dashboard-layout">
            <!-- Sidebar (Figure 5.43) -->
            <aside class="sidebar">
                <div style="display:flex; align-items:center; gap:12px; padding-bottom:16px; border-bottom:1px solid var(--border-color);">
                    <img id="sidebar-user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" style="width:44px; height:44px; border-radius:50%; object-fit:cover;">
                    <div>
                        <div id="sidebar-user-name" style="font-weight:700; font-size:0.95rem;">المستخدم</div>
                        <div id="sidebar-user-badge" style="font-size:0.75rem; color:var(--accent-orange); font-weight:600;">مشتري معتمد • VIP</div>
                    </div>
                </div>

                <ul class="sidebar-menu">
                    <li class="sidebar-item"><a href="/marketplace.html">🔍 تصفح سوق السيارات</a></li>
                    <li class="sidebar-item active"><a href="/buyer-dashboard.html">📅 حجوزاتي وفواتيري</a></li>
                    <li class="sidebar-item"><a href="/messages.html">💬 المحادثات والعروض</a></li>
                    <li class="sidebar-item"><a href="/index.html">🏠 الرئيسية</a></li>
                </ul>
            </aside>

            <!-- Main Content Area (Figure 5.43 & Figure 5.50) -->
            <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
                    <div>
                        <h2 style="font-size:1.8rem; font-weight:800;">سجل الحجوزات والمركبات المحجوزة</h2>
                        <p style="color:var(--text-secondary); font-size:0.88rem;">متابعة حالة موافقة المعارض، إتمام دفع العربون، ومواعيد التسليم في مركز KARAJAK.</p>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-primary btn-sm" onclick="filterBookings('all')">جميع الحجوزات</button>
                        <button class="btn btn-outline btn-sm" onclick="filterBookings('Reserved')">قيد الانتظار</button>
                        <button class="btn btn-outline btn-sm" onclick="filterBookings('Purchased')">المدفوعة والمؤكدة</button>
                    </div>
                </div>

                <!-- Bookings Grid (Figure 5.43) -->
                <div id="buyer-bookings-container">
                    <!-- Dynamically populated from real DB via buyer.js -->
                </div>
            </div>
        </div>
    </main>

    <script src="/js/navbar.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/buyer.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderHeader("buyer-dashboard");
            initBuyerDashboard();
        });
    </script>
</body>
</html>
